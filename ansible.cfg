# Ansible reads this file when you run it from the repository root.

[defaults]
collections_path = .
inventory = inventory
roles_path = roles:~/.ansible/roles:/usr/share/ansible/roles
library = plugins/modules:~/.ansible/plugins/modules:/usr/share/ansible/plugins/modules
filter_plugins = plugins/filter:~/.ansible/plugins/filter:/usr/share/ansible/plugins/filter
collection_paths = ~/.ansible/collections:/usr/share/ansible/collections
