---
name: Release

on:
  push:
    branches:
      - main
    # A change only to the docs can't change the config, so it can't make a release. The same list as the CI workflow's.
    # README.md isn't skipped, because the end-to-end tests read its meta-data example.
    paths:
      - "**"
      - "!**.md"
      - "README.md"
      - "!.claude/**"
      - "!.github/dependabot.yml"
      - "!.vscode/**"
      - "!docs/**"
      - "!LICENSE"

permissions:
  contents: read

# A run waits for the one in progress, and a newer push replaces a run that's still waiting, so two releases never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: &runs-on ubuntu-26.04
    outputs:
      distros: ${{ steps.distros.outputs.distros }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in the CI workflow, the build runs cloud-init's make-mime and reads the manifests with jq.
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init jq make

      - name: Build the config
        run: make build

      # The end-to-end tests install each distro the build made a user-data for, as a JSON list for their matrix.
      - name: List the distros
        id: distros
        run: |
          distros=$(find dist -maxdepth 1 -name '*.user-data' -printf '%f\n' | sed 's/\.user-data$//' | sort | jq -Rnc '[inputs]')
          echo "distros=$distros" >> "$GITHUB_OUTPUT"
          echo "Built $distros"

      # The manifests' version is the release's. A release is due only when no tag has that version yet, so a change
      # that doesn't bump it releases nothing, and the later jobs are skipped. A failure to read the tags fails the job,
      # so a release is never made because they couldn't be read.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(make --no-print-directory --silent version)
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq '.[].ref')
          if grep -Fxq "refs/tags/v$version" <<< "$tags"; then
            echo "::notice title=Release::v$version is already released, so there's nothing to release."
            version=
          else
            echo "::notice title=Release::Releasing v$version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the config
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only a release that's due, from a build that passed, reaches the Windows runners. Each distro and case installs the
  # instance the README describes on its own runner, because WSL instances on one machine share a cgroup tree. It runs
  # under WSL's default settings, because the .wslconfig is an optional example.
  e2e:
    name: End-to-end ${{ matrix.distro }} ${{ matrix.case }}
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: windows-2025
    # A WSL job can freeze the runner, and then step timeouts never fire.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # include adds each case's values to every distro's job for that case.
      matrix:
        distro: ${{ fromJSON(needs.build.outputs.distros) }}
        case:
          - with a user
          - without a user
        include:
          - case: with a user
            user: jdoe
            git-name: Jane Doe
            git-email: 1+jdoe@users.noreply.github.com
          - case: without a user
            user: ""
            git-name: ""
            git-email: ""
    defaults:
      run:
        shell: pwsh
    env:
      INSTANCE: ${{ matrix.distro }}
      WSL_UTF8: "1"
    steps:
      # For the test scripts. The config comes from the build job, so it's the one that would be released.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Put the cloud-init files in place
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
          E2E_GIT_EMAIL: ${{ matrix.git-email }}
        run: >-
          ./.github/scripts/seed-cloud-init.ps1 -Instance $env:INSTANCE -UserData "dist/$env:INSTANCE.user-data"
          -Readme README.md -Username $env:E2E_USER -GitName $env:E2E_GIT_NAME -GitEmail $env:E2E_GIT_EMAIL

      - name: Install the distribution
        run: ./.github/scripts/install-instance.ps1 -Instance $env:INSTANCE

      - name: Wait for cloud-init
        timeout-minutes: 40
        run: ./.github/scripts/wait-for-cloud-init.ps1 -Instance $env:INSTANCE

      - name: Restart the instance
        timeout-minutes: 10
        run: ./.github/scripts/restart-instance.ps1 -Instance $env:INSTANCE

      - name: Check the instance
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
        run: ./.github/scripts/check-instance.ps1 -Instance $env:INSTANCE

  # The only job that can write to the repository, so it runs no repository code: it has no checkout, and only publishes
  # the files the build job made and the end-to-end tests passed. gh release create tags the commit they came from.
  release:
    name: Release
    # needs skips this job when the build or an end-to-end test fails, or when the end-to-end tests are skipped.
    needs:
      - build
      - e2e
    if: needs.build.outputs.version != ''
    runs-on: *runs-on
    # actions: read to find the newest run of this workflow.
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # A newer run of this workflow releases this commit's changes too, so only the newest run releases. A docs-only
      # push starts no run, so it doesn't hold a release back. That also stops a re-run of an older run publishing an
      # older config. A version with a pre-release part, such as 0.1.0-rc.1, is published as a pre-release, which the
      # README's latest download links skip.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          newest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "::notice title=Release::Run $newest is newer, so it makes the release instead."
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "${prerelease[@]}"
