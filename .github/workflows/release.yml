---
name: Release

on:
  push:
    branches:
      - main
    # A change only to the docs can't change the config, so it can't make a release. The same list as the CI workflow's.
    # README.md isn't skipped, because the end-to-end tests read its meta-data example. Any other change runs the build,
    # which releases only when the user-data differs from the latest release's.
    paths:
      - "**"
      - "!**.md"
      - "README.md"
      - "!.claude/**"
      - "!.github/dependabot.yml"
      - "!.vscode/**"
      - "!docs/**"
      - "!LICENSE"

permissions:
  contents: read

# A run waits for the one in progress, and a newer push replaces a run that's still waiting, so two releases never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: &runs-on ubuntu-26.04
    outputs:
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      # commitizen reads the commits and tags since the latest release, so it needs the whole history.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # As in the CI workflow, the build runs cloud-init's make-mime. commitizen works out the version.
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init commitizen make

      - name: Build the config
        run: make build

      # The build gives the same fragments the same file, so the same SHA-1 means nothing has changed. A release is due
      # only when the built user-data's SHA-1 differs from the latest release's, or there's no release yet. Otherwise the
      # tag is empty, and the later jobs are skipped. Any failure to read the latest release fails the job, so a release
      # is never made because it couldn't be read. commitizen works out the version from the commits since the latest
      # tag, with the settings in .cz.toml: --yes answers its question when there's no tag yet, and --allow-no-commit
      # gives a patch when no commit calls for a bump. The first release is never below v0.1.0.
      - name: Compare with the latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(sha1sum < dist/Ubuntu.user-data | cut -d ' ' -f 1)
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq length)
          published=
          if [ "$releases" != 0 ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern Ubuntu.user-data --dir "$RUNNER_TEMP/latest"
            published=$(sha1sum < "$RUNNER_TEMP/latest/Ubuntu.user-data" | cut -d ' ' -f 1)
          fi
          echo "Built $built, latest release ${published:-none}."
          tag=
          if [ "$built" = "$published" ]; then
            echo "::notice title=Release::The user-data is the same as the latest release's, so there's nothing to release."
          else
            version=$(cz bump --get-next --yes --allow-no-commit < /dev/null)
            case "$version" in
              0.0.*) version=0.1.0 ;;
            esac
            tag="v$version"
            echo "::notice title=Release::Releasing $tag."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload the config
        if: steps.compare.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/Ubuntu.user-data
          if-no-files-found: error

  # Only a release that's due, from a build that passed, reaches the Windows runners. Each case installs the instance
  # the README describes on its own runner, because WSL instances on one machine share a cgroup tree. It runs under
  # WSL's default settings, because the .wslconfig is an optional example.
  e2e:
    name: End-to-end ${{ matrix.case }}
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: windows-2025
    # A WSL job can freeze the runner, and then step timeouts never fire.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # include adds each case's values to its job.
      matrix:
        case:
          - with a user
          - without a user
        include:
          - case: with a user
            user: jdoe
            git-name: Jane Doe
            git-email: 1+jdoe@users.noreply.github.com
          - case: without a user
            user: ""
            git-name: ""
            git-email: ""
    defaults:
      run:
        shell: pwsh
    # The instance wsl --install Ubuntu makes, as the README says.
    env:
      INSTANCE: Ubuntu
      WSL_UTF8: "1"
    steps:
      # For the test scripts. The config comes from the build job, so it's the one that would be released.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Put the cloud-init files in place
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
          E2E_GIT_EMAIL: ${{ matrix.git-email }}
        run: >-
          ./.github/scripts/seed-cloud-init.ps1 -Instance $env:INSTANCE -UserData dist/Ubuntu.user-data
          -Readme README.md -Username $env:E2E_USER -GitName $env:E2E_GIT_NAME -GitEmail $env:E2E_GIT_EMAIL

      - name: Install the distribution
        run: ./.github/scripts/install-instance.ps1 -Instance $env:INSTANCE

      - name: Wait for cloud-init
        timeout-minutes: 40
        run: ./.github/scripts/wait-for-cloud-init.ps1 -Instance $env:INSTANCE

      - name: Restart the instance
        timeout-minutes: 10
        run: ./.github/scripts/restart-instance.ps1 -Instance $env:INSTANCE

      - name: Check the instance
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
        run: ./.github/scripts/check-instance.ps1 -Instance $env:INSTANCE

  # The only job that can write to the repository, so it runs no repository code: it has no checkout, and only publishes
  # the user-data the build job made and the end-to-end tests passed. gh release create tags the commit it came from.
  release:
    name: Release
    # needs skips this job when the build or an end-to-end test fails, or when the end-to-end tests are skipped.
    needs:
      - build
      - e2e
    if: needs.build.outputs.tag != ''
    runs-on: *runs-on
    # actions: read to find the newest run of this workflow.
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # A newer run of this workflow releases this commit's changes too, so only the newest run releases. A docs-only
      # push starts no run, so it doesn't hold a release back. That also stops a re-run of an older run publishing an
      # older config. The user-data is the release's only asset.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          newest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "::notice title=Release::Run $newest is newer, so it makes the release instead."
            exit 0
          fi
          gh release create "$TAG" dist/Ubuntu.user-data --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
