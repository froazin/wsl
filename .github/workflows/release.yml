---
name: Release

on: {}
  # push:
  #   branches:
  #     - main
  #   # A change only to the docs can't change the config, so it can't make a release. The same list as the CI workflow's.
  #   paths:
  #     - "**"
  #     - "!**.md"
  #     - "README.md"
  #     - "!.claude/**"
  #     - "!.github/dependabot.yml"
  #     - "!.vscode/**"
  #     - "!docs/**"
  #     - "!LICENSE"

permissions:
  contents: read

# A run waits for the one in progress, and a newer push replaces a run that's still waiting, so two releases never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and version
    runs-on: &runs-on ubuntu-26.04
    outputs:
      distros: ${{ steps.distros.outputs.distros }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # semantic-release reads every commit and tag since the last release, so it needs the whole history.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init python3-yaml shellcheck

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # As in the CI workflow, the venv is built on the runner's system Python, so the validation can import apt's
      # cloud-init.
      - name: Install the dev dependencies
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync

      - name: Build and validate the config
        run: uv run invoke validate

      # The end-to-end tests install each distro the build made a user-data for, as a JSON list for their matrix.
      - name: List the distros
        id: distros
        run: |
          distros=$(find dist -maxdepth 1 -name '*.user-data' -printf '%f\n' | sed 's/\.user-data$//' | sort | jq -Rnc '[inputs]')
          echo "distros=$distros" >> "$GITHUB_OUTPUT"
          echo "Built $distros"

      # Before the first release there's nothing to download, and the folder stays missing. Any other failure fails the
      # job, so a release is never made because the latest one couldn't be read.
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json tagName --jq length)
          if [ "$releases" = 0 ]; then
            echo "There's no release yet."
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*' --dir "$RUNNER_TEMP/latest-release"
            ls -l "$RUNNER_TEMP/latest-release"
          fi

      # Prints nothing when dist/ is the same as the latest release's files, and then the later jobs are skipped.
      - name: Work out the version
        id: version
        run: |
          version=$(uv run invoke version --previous "$RUNNER_TEMP/latest-release")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "::notice title=Release::Releasing v$version."
          else
            echo "::notice title=Release::dist/ is the same as the latest release, so there's nothing to release."
          fi

      - name: Upload the config
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only a release that's due, from a build that passed, reaches the Windows runners. Each distro and case installs the
  # instance the README describes on its own runner, because WSL instances on one machine share a cgroup tree. It runs
  # under WSL's default settings, because the .wslconfig is an optional example.
  e2e:
    name: End-to-end ${{ matrix.distro }} ${{ matrix.case }}
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: windows-2025
    # A WSL job can freeze the runner, and then step timeouts never fire.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # include adds each case's values to every distro's job for that case.
      matrix:
        distro: ${{ fromJSON(needs.build.outputs.distros) }}
        case:
          - with a user
          - without a user
        include:
          - case: with a user
            user: jdoe
            git-name: Jane Doe
            git-email: 1+jdoe@users.noreply.github.com
          - case: without a user
            user: ""
            git-name: ""
            git-email: ""
    defaults:
      run:
        shell: pwsh
    env:
      INSTANCE: ${{ matrix.distro }}
      WSL_UTF8: "1"
    steps:
      # For the test scripts. The config comes from the build job, so it's the one that would be released.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Put the cloud-init files in place
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
          E2E_GIT_EMAIL: ${{ matrix.git-email }}
        run: >-
          ./.github/scripts/seed-cloud-init.ps1 -Instance $env:INSTANCE -UserData "dist/$env:INSTANCE.user-data"
          -Readme README.md -Username $env:E2E_USER -GitName $env:E2E_GIT_NAME -GitEmail $env:E2E_GIT_EMAIL

      - name: Install the distribution
        run: ./.github/scripts/install-instance.ps1 -Instance $env:INSTANCE

      - name: Wait for cloud-init
        timeout-minutes: 40
        run: ./.github/scripts/wait-for-cloud-init.ps1 -Instance $env:INSTANCE

      - name: Restart the instance
        timeout-minutes: 10
        run: ./.github/scripts/restart-instance.ps1 -Instance $env:INSTANCE

      - name: Check the instance
        env:
          E2E_USER: ${{ matrix.user }}
          E2E_GIT_NAME: ${{ matrix.git-name }}
        run: ./.github/scripts/check-instance.ps1 -Instance $env:INSTANCE

  # The only job that can write to the repository, so it runs no repository code: it has no checkout, and only publishes
  # the files the build job made and the end-to-end tests passed. gh release create tags the commit they came from.
  release:
    name: Release
    # needs skips this job when the build or an end-to-end test fails, or when the end-to-end tests are skipped.
    needs:
      - build
      - e2e
    if: needs.build.outputs.version != ''
    runs-on: *runs-on
    permissions:
      contents: write
    steps:
      - name: Download the config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # A newer push's run releases this commit's changes too, so only the head of main is released. That also stops
      # a re-run of an older run publishing an older config.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=Release::main has moved on to $head, so its run makes the release instead."
            exit 0
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
