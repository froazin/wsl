[project]
name = "wsl"
version = "0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["pkg"]
norecursedirs = [".*", "*.egg", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = ["-ra", "-q", "-p", "no:cacheprovider"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
