[project]
name = "wsl"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
exclude-newer = "7 days"
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 120
target-version = "py314"
# pkg is first-party, for sorting imports.
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
